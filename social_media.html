    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }

        /* --- PRELOADER --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loader-logo { height: 60px; margin-bottom: 20px; animation: pulse 1.5s infinite ease-in-out; }
        .loader-circle { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #333; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } }
        .preloader-hidden { opacity: 0; pointer-events: none; }

        /* --- LOGO --- */
        #logo-container { position: fixed; top: 20px; left: 20px; z-index: 110; }
        #logo-container img { height: 80px; width: auto; display: block; }

        /* --- HEADER --- */
        .image-container { position: relative; height: 40vh; text-align: center; color: white; overflow: hidden; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .image-container h1 { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            font-size: 3em; margin: 0; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); 
        }

        /* --- MENÜ --- */
        .open-btn { position: fixed; top: 20px; right: 20px; font-size: 30px; cursor: pointer; background-color: #333; color: white; border: none; padding: 10px 15px; border-radius: 5px; z-index: 100; }
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 120; top: 0; right: 0; background-color: #111; overflow-x: hidden; transition: 0.5s; padding-top: 60px; }
        .sidebar a { padding: 8px 32px; text-decoration: none; font-size: 25px; color: #818181; display: block; transition: 0.3s; }
        .sidebar a:hover { color: white; }
        .close-btn { position: absolute; top: 10px; right: 25px; font-size: 36px; color: white; cursor: pointer; }

        /* --- SOCIAL LINKS --- */
        .social-container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
        .social-link-block {
            display: flex; align-items: center; justify-content: center;
            background-color: white; padding: 20px; margin-bottom: 15px;
            border-radius: 12px; text-decoration: none; color: #333; font-size: 20px;
            font-weight: bold; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); transition: 0.3s;
        }
        .social-link-block:hover { transform: translateY(-3px); color: white; }
        .youtube-block:hover { background-color: #ff0000; }
        .instagram-block:hover { background-color: #e4405f; }
        .whatsapp-block:hover { background-color: #25D366; }

        /* --- VIDEO & INSTA BOX --- */
        .content-box { 
            background-color: white; padding: 20px; border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); margin-top: 30px; 
        }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* --- FOOTER --- */
        footer { background-color: #333; color: white; padding: 20px 0; text-align: center; }
        .footer-nav a { color: white; text-decoration: none; margin: 0 10px; }
    </style>
</head>
<body>

        </div>
        <p>&copy; 2026 FPfan08</p>
    </footer>
