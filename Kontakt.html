
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt | Oliver Profaska</title>
    <style>
        :root {
            --primary-blue: #1a3a5f; 
            --accent-red: #e63946;   
            --bg-light: #f4f4f9;
            --text-dark: #333;
            --white: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- PRELOADER STYLING --- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .preloader-content {
            text-align: center;
        }

        .preloader-logo {
            height: 100px;
            width: auto;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loading-bar-container {
            width: 150px;
            height: 4px;
            background-color: #eee;
            border-radius: 10px;
            margin: 0 auto;
            overflow: hidden;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background-color: var(--primary-blue);
            animation: loadProgress 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes loadProgress {
            0% { width: 0%; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0%; margin-left: 100%; }
        }

        .preloader-hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* --- VISITENKARTE STYLING --- */
        .card {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 0 0 30px 0; 
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            overflow: hidden; 
        }

        .hero-banner {
            position: relative;
            width: 100%;
            height: 240px; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .banner-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            width: 100%;
        }

        .hero-content img {
            max-width: 200px; 
            height: auto;
            margin-bottom: 5px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .hero-content h2 {
            margin: 0;
            padding: 0;
            color: white;
            border-bottom: none;
            font-size: 1.7rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
        }

        .card-content {
            padding: 20px;
        }

        .info-row {
            margin: 18px 0;
            text-align: left;
            padding-left: 10px;
        }

        .label {
            font-weight: bold;
            display: block;
            color: #888;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 1.1rem;
            display: block;
            margin-top: 2px;
            color: var(--text-dark);
            text-decoration: none;
        }

        .btn-container {
            margin-top: 20px;
            padding: 0 20px;
        }

        .btn {
            display: block;
            background: var(--primary-blue);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        .btn-web { background: #2c5282; }
        .btn-mail { background: #4a5568; }
        .btn-yt { background: #ff0000; }

        .footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #bbb;
        }
    </style>
</head>
<body>

<div id="preloader">
    <div class="preloader-content">
        <img src="logo.png" alt="FPfan08 Logo" class="preloader-logo">
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>
</div>

<div class="card">
    <div class="hero-banner">
        <img src="IMG_20251113_092917_070541.jpg" alt="Banner Hintergrund" class="banner-bg">

        <div class="hero-content">
            <img src="logo.png" alt="FP Fan 08 Logo">
            <h2>Oliver Profaska</h2>
        </div>
    </div>

    <div class="card-content">
        <div class="info-row">
            <span class="label">Telefon</span>
            <a href="tel:+49 171 1571562" class="value">+49 171 1571562</a>
        </div>

        <div class="info-row">
            <span class="label">E-Mail</span>
            <a href="mailto:fpfan08@fotoservice-schiessler.de" class="value">fpfan08@fotoservice-schiessler.de</a>
        </div>

        <div class="info-row">
            <span class="label">Adresse</span>
            <a href="https://maps.google.com/?q=Kurze+Straße+7,09390+Gornsdorf" target="_blank" class="value">
                Kurze Straße 7<br>
                09390 Gornsdorf
            </a>
        </div>
    </div>

    <div class="btn-container">
        <a href="https://fpfan08.github.io/fpfan08-webseite/" class="btn btn-web">Zur Website</a>
        <a href="mailto:fpfan08@fotoservice-schiessler.de" class="btn btn-mail">E-Mail schreiben</a>
        <a href="https://fpfan08.github.io/fpfan08-webseite/social_media.html" class="btn btn-yt">Zu meinen Kanälen</a>
    </div>

    <div class="footer">
        © 2026 FPfan08
    </div>
</div>

<script>
    // Preloader Ausblend-Logik
    window.addEventListener("load", function() {
        const preloader = document.getElementById("preloader");
        
        // Kleine Verzögerung für den "Smooth-Faktor"
        setTimeout(() => {
            preloader.classList.add("preloader-hidden");
        }, 800); 
    });
</script>

</body>
</html>
